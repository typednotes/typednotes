name: Extended checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  browser-and-branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install branding test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-yaml fonts-firacode fontconfig librsvg2-bin
      - name: Browser and branding checks
        # Use the distro interpreter that owns the apt-installed fontTools.
        env:
          PYTHON: /usr/bin/python3
        run: bash ci/check-extended.sh
