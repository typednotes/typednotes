name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Shared API and permission contracts
        run: cargo test -p api --features server --lib
      - name: Server and browser builds
        run: |
          cargo check -p web --features server
          cargo check -p web --features web --target wasm32-unknown-unknown
      - name: Install branding test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-fonttools fonts-firacode fontconfig librsvg2-bin
      - name: Branding contracts
        # Use the distro interpreter that owns the apt-installed fontTools.
        run: /usr/bin/python3 scripts/test_logo.py
