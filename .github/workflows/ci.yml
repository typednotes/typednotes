name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: 'Include browser compilation and branding checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Offline release gate regressions
        shell: bash
        run: bash ci/test-require-main-ci.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Shared API and permission contracts
        run: cargo test -p api --features server --lib
      - name: Server build
        run: cargo check -p web --features server
      - name: Server clippy
        run: |
          cargo clippy -p web --features server --all-targets -- -D warnings
          cargo clippy -p api --features server --all-targets -- -D warnings
      - name: Install workflow policy dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Workflow release policy
        run: /usr/bin/python3 ci/test-workflow-policy.py

  extended:
    if: github.event_name == 'workflow_dispatch' && inputs.extended == true
    uses: ./.github/workflows/extended-ci.yml
