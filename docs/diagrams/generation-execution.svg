<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">From project notes to a checked running build</title>
  <desc id="desc">The app opens Lode and receives its persisted session ID, then writes protected policies to Secrets before starting generation. Lode uses Liaison for models and repository effects, publishes code and asks Lun for build and trial feedback. The app adopts a checked build and owns subsequent stateful orchestration.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#426380"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:14px;fill:#526575}.line{fill:none;stroke:#426380;stroke-width:2;marker-end:url(#arrow)}.life{stroke:#b5c5d1;stroke-dasharray:5 5}.box{fill:#f5f8fb;stroke:#acbfce;stroke-width:1.5}</style>
  <rect width="1200" height="770" fill="white"/>
  <text x="35" y="46" class="title">Describe → implement → publish → check → adopt</text>
  <text x="35" y="76" class="body">Code generation and execution are separate contracts, driven by the application.</text>
  <path class="life" d="M140 150V702M380 150V702M650 150V702M900 150V702M1110 150V702"/>
  <g data-box="app"><rect x="40" y="105" width="200" height="45" rx="7" class="box"/><text x="140" y="134" class="head" text-anchor="middle">App</text></g>
  <g data-box="lode"><rect x="290" y="105" width="180" height="45" rx="7" class="box"/><text x="380" y="134" class="head" text-anchor="middle">Lode</text></g>
  <g data-box="liaison"><rect x="560" y="105" width="180" height="45" rx="7" class="box"/><text x="650" y="134" class="head" text-anchor="middle">Liaison</text></g>
  <g data-box="providers"><rect x="805" y="105" width="190" height="45" rx="7" class="box"/><text x="900" y="134" class="head" text-anchor="middle">Git / model hosts</text></g>
  <g data-box="lun"><rect x="1040" y="105" width="140" height="45" rx="7" class="box"/><text x="1110" y="134" class="head" text-anchor="middle">Lun</text></g>

  <path class="line" d="M140 195H380"/><text x="260" y="183" text-anchor="middle" class="small">1. Open with pins + ceilings</text>
  <path class="line" d="M380 239H140"/><text x="260" y="227" text-anchor="middle" class="small">2. Persisted session ID</text>
  <g data-box="binding"><rect x="35" y="258" width="220" height="66" rx="7" fill="#eaf6f2" stroke="#5c9184"/>
    <text x="145" y="284" class="body" text-anchor="middle">3. Bind protected policies</text><text x="145" y="307" class="small" text-anchor="middle">in Secrets before starting</text>
  </g>
  <path class="line" d="M140 360H380"/><text x="260" y="348" text-anchor="middle" class="small">4. Start with fresh grants</text>
  <path class="line" d="M380 412H650"/><text x="515" y="400" text-anchor="middle" class="small">5. Model / scoped repository IO</text>
  <path class="line" d="M650 452H900"/><text x="775" y="440" text-anchor="middle" class="small">Verify, reserve, execute, audit</text>
  <path class="line" d="M380 510H1110"/><text x="745" y="498" text-anchor="middle" class="body">6. Build published commit; run bounded trials</text>
  <path class="line" d="M1110 554H380"/><text x="745" y="542" text-anchor="middle" class="small">Diagnostics and checked interfaces feed the coding loop</text>
  <path class="line" d="M140 618H1110"/><text x="625" y="606" text-anchor="middle" class="body">7. Adopt checked build; invoke with state, inputs and current authority</text>
  <path class="line" d="M1110 669H140"/><text x="625" y="657" text-anchor="middle" class="body">8. Return new state, ordered changes, final outcomes and nextCallAt</text>
  <text x="35" y="739" class="body">The model proposes implementations. Lean checks declared contracts. Typednotes persists execution state.</text>
</svg>
