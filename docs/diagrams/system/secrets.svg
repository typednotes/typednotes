<svg xmlns="http://www.w3.org/2000/svg" width="960" height="369" viewBox="0 0 960 369" role="img" aria-labelledby="title desc">
  <title id="title">Secrets separates service identities and storage access</title>
  <desc id="desc">The app can write third-party credentials but cannot read them back. Liaison can read or refresh provider credentials within its policy. Lun is scoped to its graph-secret and compute paths. The vault authenticates each service, enforces path policy, and stores encrypted values in PostgreSQL.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#42637a"/></marker></defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}
    .canvas{fill:#fff;stroke:#a7b9c8;stroke-width:2}.box{fill:#f5f8fb;stroke:#a7b9c8;stroke-width:1.5}.secure{fill:#eaf6f2;stroke:#6c9c8e}
    .flow{fill:none;stroke:#42637a;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect x="1" y="1" width="958" height="367" rx="14" class="canvas"/>
  <text x="28" y="48" class="title">Secrets separates service identities and storage access</text>
  <path class="flow" d="M163 180V233"/><path class="flow" d="M480 180V208H335V233"/>
  <path class="flow" d="M797 180V219H466V233"/><path class="flow" d="M566 276H626"/>
  <g id="app">
    <rect x="28" y="83" width="270" height="97" rx="8" class="box"/>
    <text x="46" y="117" class="head">App identity</text><text x="46" y="150" class="body">Write provider keys and policy</text>
  </g>
  <g id="liaison">
    <rect x="345" y="83" width="270" height="97" rx="8" class="box"/>
    <text x="363" y="117" class="head">Liaison identity</text><text x="363" y="150" class="body">Read / refresh provider keys</text>
  </g>
  <g id="lun">
    <rect x="662" y="83" width="270" height="97" rx="8" class="box"/>
    <text x="680" y="117" class="head">Lun identity</text><text x="680" y="150" class="body">Bound compute + graph paths</text>
  </g>
  <g id="vault">
    <rect x="28" y="234" width="538" height="84" rx="8" class="box secure"/>
    <text x="46" y="266" class="head">Vault authenticates and checks the path policy</text>
    <text x="46" y="295" class="body">Encrypt or decrypt only for an admitted operation</text>
  </g>
  <g id="storage">
    <rect x="627" y="234" width="305" height="84" rx="8" class="box"/>
    <text x="645" y="266" class="head">Vault PostgreSQL</text><text x="645" y="295" class="body">Storage behind the barrier</text>
  </g>
  <text x="28" y="347" class="body">Provider credentials are not read back by the app or passed into generated code.</text>
</svg>
